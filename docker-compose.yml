version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marble
      POSTGRES_PASSWORD: marble123
      POSTGRES_DB: brainrot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://marble:marble123@db:5432/brainrot
    depends_on: [db]

volumes:
  pgdata:
